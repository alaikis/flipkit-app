name: flipkit
description: An intelligent K12 learning app with AI-powered question generation and evolution features.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.38.9"

dependencies:
  flutter:
    sdk: flutter

  # UI 组件库 - 使用 GetWidget (国内可用且功能完整)
  getwidget: ^4.0.0

  # 状态管理 - GetX (国内推荐)
  get: ^4.6.6

  # 网络请求
  dio: ^5.4.0

  # 本地存储
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  get_storage: ^2.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 数据库
  sqflite: ^2.3.0
  path: ^1.8.3

  # 文件和路径
  path_provider: ^2.1.1
  file_picker: ^6.1.1

  # 图片处理
  image_picker: ^1.0.5
  cached_network_image: ^3.3.0

  # OCR 和 AI
  google_ml_kit: ^0.20.0

  # 文本转语音
  flutter_tts: ^3.8.3

  # 视频播放
  # video_player: ^2.8.1  # 暂时移除，引入了不兼容的依赖
  # chewie: ^1.7.4  # 暂时移除

  # WebView (用于 GitHub 等资源)
  webview_flutter: ^4.4.2

  # PDF 处理
  syncfusion_flutter_pdf: ^24.1.41
  flutter_pdfview: ^1.3.2

  # UI 增强
  flutter_animate: ^4.3.0
  lottie: ^2.7.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0

  # Markdown 渲染 (flutter_markdown 已废弃但功能正常，暂使用)
  flutter_markdown: ^0.6.18+3

  # 工具
  intl: ^0.18.1
  uuid: ^4.3.3
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  permission_handler: ^11.1.0
  connectivity_plus: ^5.0.2

  # 代码生成
  json_annotation: ^4.8.1

  # 动画
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # 代码生成
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

# 平台特定的依赖覆盖
dependency_overrides:
  # 移除不必要的平台限制
  # google_ml_kit 在 Android/iOS 上正常工作

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/data/
